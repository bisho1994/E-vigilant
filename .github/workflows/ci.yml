name: CI Pipeline - Elecciones Napo

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  run-php-tests:
    name: Ejecutar Pruebas PHPUnit
    runs-on: ubuntu-latest

    steps:
      # 1. Descargar el código fuente del repositorio
      - name: Checkout del código
        uses: actions/checkout@v4

      # 2. Configurar el entorno de PHP
      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: phpunit

      # 3. Instalar dependencias o validar sintaxis del proyecto
      - name: Validar sintaxis de archivos PHP
        run: |
          find . -name "*.php" -print0 | xargs -0 -n 1 php -l

      # 4. Ejecutar la suite de pruebas unitarias
      - name: Ejecutar Pruebas con PHPUnit
        run: |
          if [ -d "tests" ]; then phpunit tests/; else echo "No hay directorio de pruebas configurado."; fi